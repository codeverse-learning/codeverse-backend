spring.application.name=codeverse-backend

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=codeverse_db
spring.mongodb.authentication-database=admin

# Server Configuration - Local and Render
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:7200000}
jwt.issuer=${JWT_ISSUER:codeverse-backend}
jwt.audience=${JWT_AUDIENCE:codeverse-api}

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID}

# GitHub OAuth Configuration
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:5173/github/callback}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite

# Code Time Machine Gateway
codeverse.trace.gateway-url=${TRACE_GATEWAY_URL:http://127.0.0.1:8091}

# Flutter Compilation Gateway
codeverse.flutter.gateway-url=${FLUTTER_GATEWAY_URL:http://127.0.0.1:8092}

# Worker Security
codeverse.worker.key=${CODEVERSE_WORKER_KEY:}

# Worker Feature Flags
codeverse.trace.enabled=${TRACE_ENABLED:false}
codeverse.flutter.enabled=${FLUTTER_ENABLED:false}

# Study Packs - File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Google Authentication Cookie Configuration
codeverse.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# Trusted Frontend Origin
codeverse.auth.allowed-origin=${AUTH_ALLOWED_ORIGIN:http://localhost:5173}

# Server Resource Optimization
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20

# Error Response Security
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never